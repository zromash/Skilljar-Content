<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards: Confidence Ratings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;
    background: #f8fafc;
    padding: 20px 16px;
    color: #2d3748;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .tag {
    display: inline-block;
    background: #e8f0fe;
    color: #1a56db;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .flip-area { perspective: 1000px; height: 190px; margin-bottom: 14px; }
  .flip-card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform .5s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    line-height: 1.5;
  }
  .front { background: #ffffff; color: #2d3748; }
  .back { background: #eff6ff; color: #1e3a8a; transform: rotateY(180deg); font-weight: 500; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 999px;
    width: fit-content;
  }
  .badge.high { background: #dcfce7; color: #166534; }
  .badge.medium { background: #fef9c3; color: #854d0e; }
  .badge.low { background: #f1f5f9; color: #475569; }
  .hint { text-align: center; font-size: 12px; color: #a0aec0; margin-bottom: 16px; }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  button.nav-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #1A6AFF;
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button.nav-btn:disabled { color: #cbd5e0; cursor: default; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e2e8f0; }
  .dot.active { background: #1A6AFF; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">Confidence Ratings</div>
    <div class="flip-area">
      <div class="flip-card" id="flipCard" onclick="flip()">
        <div class="face front" id="frontFace"></div>
        <div class="face back" id="backFace"></div>
      </div>
    </div>
    <div class="hint">Click the card to flip it</div>
    <div class="nav">
      <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
    </div>
  </div>
  <script>
    var cards = [
      { badge: 'high', badgeLabel: 'High Confidence', front: 'A row is marked HIGH confidence.', back: 'The name and due date were clearly stated in the syllabus. Still worth a glance, but this is the lowest-risk row on the list.' },
      { badge: 'medium', badgeLabel: 'Medium Confidence', front: 'A row is marked MEDIUM confidence.', back: 'Mostly clear, but something was ambiguous enough to flag. Give it a quick read before confirming the import.' },
      { badge: 'low', badgeLabel: 'Low Confidence', front: "A row is marked LOW confidence — the syllabus just said 'Midterm (date TBD)'.", back: "The importer couldn't find a firm date, so the row is unchecked by default. Fill in the real date yourself before you import it — don't approve it as-is." }
    ];
    var current = 0;
    var flipped = false;

    function render() {
      document.getElementById('frontFace').innerHTML = '<span class="badge ' + cards[current].badge + '">' + cards[current].badgeLabel + '</span><div>' + cards[current].front + '</div>';
      document.getElementById('backFace').textContent = cards[current].back;
      document.getElementById('flipCard').classList.remove('flipped');
      flipped = false;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === cards.length - 1;
      var dotsHtml = '';
      cards.forEach(function (c, i) {
        dotsHtml += '<div class="dot' + (i === current ? ' active' : '') + '"></div>';
      });
      document.getElementById('dots').innerHTML = dotsHtml;
    }

    function flip() {
      flipped = !flipped;
      document.getElementById('flipCard').classList.toggle('flipped', flipped);
    }

    function go(delta) {
      var next = current + delta;
      if (next < 0 || next > cards.length - 1) return;
      current = next;
      render();
    }

    render();
  </script>
</body>
</html>
