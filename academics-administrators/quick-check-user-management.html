<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management – Quick Check</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;
    background: #f8fafc;
    padding: 20px 16px;
    color: #2d3748;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 24px 26px;
  }
  .tag {
    display: inline-block;
    background: #e8f0fe;
    color: #1a56db;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    line-height: 1.4;
    margin-bottom: 16px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option {
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    color: #2d3748;
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button.option:hover { border-color: #1A6AFF; }
  button.option.correct { border-color: #16a34a; background: #f0fdf4; color: #14532d; font-weight: 600; }
  button.option.incorrect { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
  button.option:disabled { cursor: default; }
  .feedback {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }
  .feedback.incorrect { background: #fef2f2; color: #7f1d1d; border: 1px solid #fecaca; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Quick Check</div>
    <h1>What determines a new user's access to modules in Teamworks Academics?</h1>
    <div class="options" id="options">
      <button class="option" data-correct="true" onclick="pick(this, true, 'Right — role assignment is what drives module access.')">The role(s) assigned when their account is created</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'Not quite — Academics doesn\'t read your HR system.')">Their job title in your campus HR system</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'Nope — access isn\'t tied to browser.')">The browser they log in from</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'Not accurate — access is role-based, not universal.')">Nothing — all users see everything</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <script>
    var answered = false;
    function pick(el, isCorrect, feedback) {
      if (answered) return;
      answered = true;
      var buttons = document.querySelectorAll('.option');
      buttons.forEach(function(b) { b.disabled = true; });
      el.classList.add(isCorrect ? 'correct' : 'incorrect');
      if (!isCorrect) {
        buttons.forEach(function(b) { if (b.dataset.correct === 'true') b.classList.add('correct'); });
      }
      var fb = document.getElementById('feedback');
      fb.textContent = feedback;
      fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
    }
  </script>
</body>
</html>
