<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards: Which Setting Fixes This?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;
    background: #f8fafc;
    padding: 20px 16px;
    color: #2d3748;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .tag {
    display: inline-block;
    background: #e8f0fe;
    color: #1a56db;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .flip-area { perspective: 1000px; height: 190px; margin-bottom: 14px; }
  .flip-card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform .5s;
    transform-style: preserve-3d;
  }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    font-size: 15px;
    line-height: 1.5;
  }
  .front { background: #ffffff; color: #2d3748; }
  .back { background: #eff6ff; color: #1e3a8a; transform: rotateY(180deg); font-weight: 500; }
  .hint { text-align: center; font-size: 12px; color: #a0aec0; margin-bottom: 16px; }
  .nav { display: flex; justify-content: space-between; align-items: center; }
  button.nav-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: #1A6AFF;
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
  }
  button.nav-btn:disabled { color: #cbd5e0; cursor: default; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e2e8f0; }
  .dot.active { background: #1A6AFF; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">Which Setting Fixes This?</div>
    <div class="flip-area">
      <div class="flip-card" id="flipCard" onclick="flip()">
        <div class="face front" id="frontFace"></div>
        <div class="face back" id="backFace"></div>
      </div>
    </div>
    <div class="hint">Click the card to flip it</div>
    <div class="nav">
      <button class="nav-btn" id="prevBtn" onclick="go(-1)">← Back</button>
      <div class="dots" id="dots"></div>
      <button class="nav-btn" id="nextBtn" onclick="go(1)">Next →</button>
    </div>
  </div>
  <script>
    var cards = [
      { front: "A student keeps forgetting to check out of study hall and their hours keep climbing.", back: 'Set an auto check-out time on the Location. Check-in Categories track what — Locations control when it stops.' },
      { front: 'You want to know WHY appointments keep getting cancelled, not just that they were.', back: 'That\'s a Cancellation Reason, attached at the Appointment Type level — every cancellation gets tagged with one.' },
      { front: 'A tutoring appointment type needs a reminder email sent out whenever a session is scheduled — and, separately, advisor approval required before any booking on that type is confirmed.', back: 'Both live on the Appointment Type itself — notifications and approval policies are separate settings configured per type, not per location.' },
      { front: "Front desk wants students to scan a QR code that can't just be screenshotted and reused by someone else.", back: 'Enable QR code refresh on the Location — it rotates the code so a static screenshot stops working.' }
    ];
    var current = 0;
    var flipped = false;

    function render() {
      document.getElementById('frontFace').textContent = cards[current].front;
      document.getElementById('backFace').textContent = cards[current].back;
      document.getElementById('flipCard').classList.remove('flipped');
      flipped = false;
      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('nextBtn').disabled = current === cards.length - 1;
      var dotsHtml = '';
      cards.forEach(function (c, i) {
        dotsHtml += '<div class="dot' + (i === current ? ' active' : '') + '"></div>';
      });
      document.getElementById('dots').innerHTML = dotsHtml;
    }

    function flip() {
      flipped = !flipped;
      document.getElementById('flipCard').classList.toggle('flipped', flipped);
    }

    function go(delta) {
      var next = current + delta;
      if (next < 0 || next > cards.length - 1) return;
      current = next;
      render();
    }

    render();
  </script>
</body>
</html>
