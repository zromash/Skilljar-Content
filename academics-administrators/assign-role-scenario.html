<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scenario: Stacking Roles</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope','Helvetica Neue',Helvetica,Arial,sans-serif;
    background: #f8fafc;
    padding: 20px 16px;
    color: #2d3748;
  }
  .card {
    max-width: 600px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 24px 26px;
  }
  .tag {
    display: inline-block;
    background: #e8f0fe;
    color: #1a56db;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .scenario { font-size: 15px; line-height: 1.6; color: #2d3748; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  button.option {
    text-align: left;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    color: #2d3748;
    background: #ffffff;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button.option:hover { border-color: #1A6AFF; }
  button.option.correct { border-color: #16a34a; background: #f0fdf4; color: #14532d; font-weight: 600; }
  button.option.incorrect { border-color: #dc2626; background: #fef2f2; color: #7f1d1d; }
  button.option:disabled { cursor: default; }
  .feedback {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.5;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #f0fdf4; color: #14532d; border: 1px solid #bbf7d0; }
  .feedback.incorrect { background: #fef2f2; color: #7f1d1d; border: 1px solid #fecaca; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Scenario</div>
    <p class="scenario">Your Assistant Director of Academics already has full Advisor access. Starting this term, she'll also send progress reports to professors and needs to see what comes back on the Grade Reports page. What's the best way to set this up?</p>
    <div class="options" id="options">
      <button class="option" data-correct="true" onclick="pick(this, true, 'Right — roles stack. Keep her existing Advisor account and add the Progress Report Manager role on top. No need to touch anything else.')">Keep her as Advisor and add the Progress Report Manager role to her existing account</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'That creates a duplicate account and splits her history across two logins for no reason — roles can just be added to the account she already has.')">Create a second account for her with only Progress Report Manager</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'That gives her far more access than the job needs — full Administrator can edit appointment types, cancellation reasons, and school-wide settings.')">Make her a full Administrator so she can do everything</button>
      <button class="option" data-correct="false" onclick="pick(this, false, 'Not necessary — this is a standard role combination you can add yourself in User Management.')">Ask your Product Success Manager to build a custom role</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
  <script>
    var answered = false;
    function pick(el, isCorrect, feedback) {
      if (answered) return;
      answered = true;
      var buttons = document.querySelectorAll('.option');
      buttons.forEach(function (b) { b.disabled = true; });
      el.classList.add(isCorrect ? 'correct' : 'incorrect');
      if (!isCorrect) {
        buttons.forEach(function (b) { if (b.dataset.correct === 'true') b.classList.add('correct'); });
      }
      var fb = document.getElementById('feedback');
      fb.textContent = feedback;
      fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'incorrect');
    }
  </script>
</body>
</html>
